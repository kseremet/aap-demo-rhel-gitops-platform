---
# Configure the existing GitHub MCP workload, not AO. Namespace-local sidecar
# traffic preserves the caller's GitHub bearer header without storing a token.
- name: Validate GitHub MCP text adapter inputs
  tags: [ao, github_adapter]
  ansible.builtin.assert:
    that:
      - ao_github_text_kube_host | length > 0
      - ao_github_text_kube_token | length > 0
      - openshift_vm_namespace | length > 0
      - demo_ao_github_mcp_url | urlsplit('scheme') == 'http'
      - demo_ao_github_mcp_url | urlsplit('path') == '/mcp'
      - not (demo_ao_github_mcp_url | urlsplit('username'))
      - not (demo_ao_github_mcp_url | urlsplit('password'))
      - not (demo_ao_github_mcp_url | urlsplit('query'))
      - not (demo_ao_github_mcp_url | urlsplit('fragment'))
      - (demo_ao_github_mcp_url | urlsplit('hostname')).split('.')[0] == ao_github_text_service_name
      - ao_github_text_adapter_port | int > 1024
      - ao_github_text_adapter_port | int < 65536
      - ao_github_text_adapter_port | int != (demo_ao_github_mcp_url | urlsplit('port') | int)
    fail_msg: Configure the existing in-cluster HTTP GitHub MCP service and Kubernetes credentials before enabling its text adapter.
    quiet: true
  no_log: true

- name: Read the existing GitHub MCP deployment
  tags: [ao, github_adapter]
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ao_github_text_deployment_name }}"
    namespace: "{{ openshift_vm_namespace }}"
    host: "{{ ao_github_text_kube_host }}"
    api_key: "{{ ao_github_text_kube_token }}"
    validate_certs: "{{ ao_github_text_kube_verify }}"
  register: _ao_github_text_deployment
  no_log: true

- name: Read the existing GitHub MCP service
  tags: [ao, github_adapter]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: "{{ ao_github_text_service_name }}"
    namespace: "{{ openshift_vm_namespace }}"
    host: "{{ ao_github_text_kube_host }}"
    api_key: "{{ ao_github_text_kube_token }}"
    validate_certs: "{{ ao_github_text_kube_verify }}"
  register: _ao_github_text_service
  no_log: true

- name: Require the existing GitHub MCP resources
  tags: [ao, github_adapter]
  ansible.builtin.assert:
    that:
      - _ao_github_text_deployment.resources | length == 1
      # Handoff packets are process-local; this demo endpoint must have one replica.
      - _ao_github_text_deployment.resources[0].spec.replicas | default(1) | int == 1
      - _ao_github_text_service.resources | length == 1
      - >-
        _ao_github_text_deployment.resources[0].spec.template.spec.containers | selectattr('name', 'equalto',
        ao_github_text_upstream_container) | list | length == 1
      - _ao_github_text_service.resources[0].spec.ports | selectattr('port', 'equalto', demo_ao_github_mcp_url | urlsplit('port') | int) | list | length == 1
    fail_msg: The configured GitHub MCP workload or original Service port was not found.
    quiet: true
  no_log: true

- name: Resolve the upstream container and service port
  tags: [ao, github_adapter]
  ansible.builtin.set_fact:
    _ao_github_text_service_ports: []
    _ao_github_text_container: >-
      {{ _ao_github_text_deployment.resources[0].spec.template.spec.containers | selectattr('name', 'equalto',
      ao_github_text_upstream_container) | first }}
    _ao_github_text_service_port: >-
      {{ _ao_github_text_service.resources[0].spec.ports | selectattr('port', 'equalto', demo_ao_github_mcp_url |
      urlsplit('port') | int) | first }}
  no_log: true

- name: Resolve the original MCP container listener
  tags: [ao, github_adapter]
  ansible.builtin.set_fact:
    _ao_github_text_upstream_port: >-
      {{ (_ao_github_text_service_port.targetPort | int)
         if (_ao_github_text_service_port.targetPort | string is match('^[0-9]+$'))
         else (_ao_github_text_container.ports
               | selectattr('name', 'equalto', _ao_github_text_service_port.targetPort)
               | map(attribute='containerPort') | first) }}
  no_log: true

- name: Require an available adapter port and an owned sidecar name
  tags: [ao, github_adapter]
  ansible.builtin.assert:
    that:
      - _ao_github_text_upstream_port | int != ao_github_text_adapter_port | int
      - >-
        (_ao_github_text_deployment.resources[0].spec.template.spec.containers
         | rejectattr('name', 'equalto', 'ao-text-adapter') | selectattr('ports', 'defined')
         | map(attribute='ports') | flatten | selectattr('containerPort', 'equalto', ao_github_text_adapter_port | int) | list | length) == 0
      - >-
        (_ao_github_text_service.resources[0].spec.ports
         | selectattr('port', 'equalto', ao_github_text_adapter_port | int)
         | rejectattr('name', 'equalto', 'ao-mcp-text') | list | length) == 0
      - >-
        (_ao_github_text_deployment.resources[0].spec.template.spec.containers
         | selectattr('name', 'equalto', 'ao-text-adapter') | list | length) == 0
        or 'aap-workbench.github-mcp-text/source-sha256' in
           (_ao_github_text_deployment.resources[0].spec.template.metadata.annotations | default({}))
    fail_msg: The adapter port or container name is already owned by another workload configuration.
    quiet: true
  no_log: true

- name: Read GitHub MCP pods to preserve the current server image
  tags: [ao, github_adapter]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ openshift_vm_namespace }}"
    label_selectors: >-
      {{ (_ao_github_text_deployment.resources[0].spec.selector.matchLabels.keys() | list)
         | zip(_ao_github_text_deployment.resources[0].spec.selector.matchLabels.values() | list)
         | map('join', '=') | list }}
    host: "{{ ao_github_text_kube_host }}"
    api_key: "{{ ao_github_text_kube_token }}"
    validate_certs: "{{ ao_github_text_kube_verify }}"
  register: _ao_github_text_pods
  no_log: true

- name: Resolve the running GitHub MCP image digest
  tags: [ao, github_adapter]
  ansible.builtin.set_fact:
    _ao_github_text_running_images: >-
      {{ _ao_github_text_pods.resources | selectattr('status.containerStatuses', 'defined')
         | map(attribute='status.containerStatuses') | flatten
         | selectattr('name', 'equalto', ao_github_text_upstream_container)
         | selectattr('ready', 'equalto', true) | map(attribute='imageID')
         | map('regex_replace', '^docker-pullable://', '') | unique | list }}
  no_log: true

- name: Require one current upstream image digest
  tags: [ao, github_adapter]
  ansible.builtin.assert:
    that:
      - _ao_github_text_running_images | length == 1
      - (_ao_github_text_running_images | first) is match('^.+@sha256:[0-9a-f]{64}$')
    fail_msg: Wait for the existing GitHub MCP rollout to complete before adding the text adapter.
    quiet: true
  no_log: true

- name: Store the standard-library adapter source in a ConfigMap
  tags: [ao, github_adapter]
  kubernetes.core.k8s:
    state: present
    host: "{{ ao_github_text_kube_host }}"
    api_key: "{{ ao_github_text_kube_token }}"
    validate_certs: "{{ ao_github_text_kube_verify }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ ao_github_text_configmap_name }}"
        namespace: "{{ openshift_vm_namespace }}"
        labels:
          app.kubernetes.io/managed-by: aap-workbench
          app.kubernetes.io/component: github-mcp-text-adapter
      data:
        adapter.py: "{{ lookup('ansible.builtin.file', ao_github_text_source_file, rstrip=false) }}"
        ao_evidence.py: >-
          {{ lookup('ansible.builtin.file',
             ao_github_text_source_file | dirname ~ '/../../playbooks/ai/filter_plugins/ao_evidence.py', rstrip=false) }}
        review_checks.py: "{{ lookup('ansible.builtin.file', ao_github_text_source_file | dirname ~ '/review_checks.py', rstrip=false) }}"
        prepare_agent_prompt.py: "{{ lookup('ansible.builtin.file', ao_github_text_source_file | dirname ~ '/prepare_agent_prompt.py', rstrip=false) }}"
        handoff_packets.py: "{{ lookup('ansible.builtin.file', ao_github_text_source_file | dirname ~ '/handoff_packets.py', rstrip=false) }}"

- name: Add the compatibility sidecar while preserving GitHub MCP configuration
  tags: [ao, github_adapter]
  kubernetes.core.k8s:
    state: patched
    merge_type: [strategic-merge]
    host: "{{ ao_github_text_kube_host }}"
    api_key: "{{ ao_github_text_kube_token }}"
    validate_certs: "{{ ao_github_text_kube_verify }}"
    definition: "{{ lookup('ansible.builtin.template', ao_github_text_sidecar_template) | from_yaml }}"
  no_log: true

- name: Preserve existing Service ports and name previously unnamed ports
  tags: [ao, github_adapter]
  ansible.builtin.set_fact:
    _ao_github_text_service_ports: >-
      {{ _ao_github_text_service_ports | default([]) + [item | combine({'name': item.name | default('mcp-' ~ item.port |
      string)})] }}
  loop: "{{ _ao_github_text_service.resources[0].spec.ports | rejectattr('port', 'equalto', ao_github_text_adapter_port | int) | list }}"
  loop_control:
    label: "{{ item.port }}"

- name: Expose the text adapter on the existing allowed Service hostname
  tags: [ao, github_adapter]
  kubernetes.core.k8s:
    state: patched
    merge_type: [strategic-merge]
    host: "{{ ao_github_text_kube_host }}"
    api_key: "{{ ao_github_text_kube_token }}"
    validate_certs: "{{ ao_github_text_kube_verify }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ ao_github_text_service_name }}"
        namespace: "{{ openshift_vm_namespace }}"
        resourceVersion: "{{ _ao_github_text_service.resources[0].metadata.resourceVersion }}"
      spec:
        ports: >-
          {{ _ao_github_text_service_ports + [{'name': 'ao-mcp-text', 'port': ao_github_text_adapter_port | int,
          'targetPort': 'ao-mcp-text', 'protocol': 'TCP'}] }}

- name: Wait for both GitHub MCP and the text adapter to be ready
  tags: [ao, github_adapter]
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ao_github_text_deployment_name }}"
    namespace: "{{ openshift_vm_namespace }}"
    host: "{{ ao_github_text_kube_host }}"
    api_key: "{{ ao_github_text_kube_token }}"
    validate_certs: "{{ ao_github_text_kube_verify }}"
  register: _ao_github_text_ready
  until:
    - _ao_github_text_ready.resources | length == 1
    - _ao_github_text_ready.resources[0].status.observedGeneration | default(0) >= _ao_github_text_ready.resources[0].metadata.generation
    - _ao_github_text_ready.resources[0].status.updatedReplicas | default(0) == _ao_github_text_ready.resources[0].spec.replicas
    - _ao_github_text_ready.resources[0].status.availableReplicas | default(0) == _ao_github_text_ready.resources[0].spec.replicas
    - _ao_github_text_ready.resources[0].status.replicas | default(0) == _ao_github_text_ready.resources[0].spec.replicas
    - _ao_github_text_ready.resources[0].status.readyReplicas | default(0) == _ao_github_text_ready.resources[0].spec.replicas
    - _ao_github_text_ready.resources[0].status.unavailableReplicas | default(0) == 0
  retries: 36
  delay: 5
  no_log: true
