---
# Refresh only managed addresses from live VMIs. This task file is included by
# aap_config.yml, after normal discovery has supplied inventory membership.
# It never writes generated local files, changes SSH identities or deploys agents.
- name: Load the managed VM specification
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/all/vm_specs.yml"

- name: Read current management addresses for fleet and control VMs
  kubevirt.core.kubevirt_vmi_info:
    name: "{{ item.value.vm_name }}"
    namespace: "{{ openshift_vm_namespace }}"
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
  loop: "{{ vm_specs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _inventory_vmis
  no_log: true

- name: Require running VMs with one address and an existing inventory entry
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].status.phase == 'Running'
      - >-
        (item.resources[0].status.interfaces | selectattr('name', 'equalto', 'default')
         | selectattr('ipAddress', 'defined') | list | length) == 1
      - (controller_hosts | selectattr('name', 'equalto', item.item.key) | list | length) == 1
    fail_msg: Run VM discovery first; each managed VM must have one current address and inventory entry.
  loop: "{{ _inventory_vmis.results }}"
  loop_control:
    label: "{{ item.item.key }}"

# Retain inventory membership, SSH options and all other declared host variables.
- name: Refresh Controller addresses without rewriting local generated files
  ansible.builtin.set_fact:
    controller_hosts: >-
      {{ (controller_hosts | rejectattr('name', 'equalto', item.item.key) | list)
         + [_existing | combine({'variables': {'ansible_host': _address}}, recursive=True)] }}
  vars:
    _existing: "{{ controller_hosts | selectattr('name', 'equalto', item.item.key) | first }}"
    _address: >-
      {{ item.resources[0].status.interfaces | selectattr('name', 'equalto', 'default')
         | map(attribute='ipAddress') | first }}
  loop: "{{ _inventory_vmis.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  no_log: true

- name: Read the existing shared Linux MCP SSH aliases
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: linux-mcp-server-config
    namespace: "{{ openshift_vm_namespace }}"
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
  register: _inventory_mcp
  no_log: true

- name: Retain the original SSH configuration when MCP is already deployed
  ansible.builtin.set_fact:
    _inventory_ssh_config: "{{ _inventory_mcp.resources[0].data.config }}"
  when: _inventory_mcp.resources | length == 1
  no_log: true

# Change only HostName for existing fleet aliases. The control VM is not a
# diagnostic target, and missing aliases remain the responsibility of MCP setup.
- name: Refresh existing fleet aliases using the same management addresses
  ansible.builtin.set_fact:
    _inventory_ssh_config: "{{ _inventory_ssh_config | regex_replace(_pattern, _replacement) }}"
  vars:
    _pattern: "(?m)^(Host {{ item.item.key | regex_escape }}\\n[ \\t]+HostName )[0-9a-fA-F:.]+$"
    _address: >-
      {{ item.resources[0].status.interfaces | selectattr('name', 'equalto', 'default')
         | map(attribute='ipAddress') | first }}
    _replacement: "\\g<1>{{ _address }}"
  loop: "{{ _inventory_vmis.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - _inventory_mcp.resources | length == 1
    - item.item.value.fleet_managed | default(true) | bool
  no_log: true

- name: Update only changed SSH aliases in the existing Linux MCP ConfigMap
  kubernetes.core.k8s:
    state: patched
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: linux-mcp-server-config
        namespace: "{{ openshift_vm_namespace }}"
        resourceVersion: "{{ _inventory_mcp.resources[0].metadata.resourceVersion }}"
      data:
        config: "{{ _inventory_ssh_config }}"
  when:
    - _inventory_mcp.resources | length == 1
    - _inventory_ssh_config != _inventory_mcp.resources[0].data.config
  no_log: true
