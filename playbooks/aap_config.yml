# Description: Configure AAP objects for the platform and GitOps repositories.
---
- name: Configure RHEL GitOps AAP objects # noqa: fqcn[keyword] - explicit collections policy
  hosts: localhost
  connection: local
  gather_facts: false
  collections: [ansible.builtin, ansible.eda, kubernetes.core, kubevirt.core, infra.aap_configuration]
  tags: [aap]
  vars_files:
    - ../vault.yml
    - ../group_vars/all/demo_variables.yml
    - ../group_vars/all/casc.yml
    - ../group_vars/all/generated_inventory.yml

  pre_tasks:
    - name: Resolve project-root SSH key path
      ansible.builtin.set_fact:
        demo_ssh_private_key_path: "{{ playbook_dir }}/../{{ demo_ssh_private_key_file }}"

    - name: Validate bootstrap inputs
      ansible.builtin.assert:
        that:
          - aap_hostname is defined
          - aap_hostname != 'CHANGE_ME_AAP_URL'
          - vault_aap_token is defined
          - demo_state_scm_url != 'CHANGE_ME_GIT_REPO_URL'
          - demo_platform_scm_url != 'CHANGE_ME_PLATFORM_REPO_URL'
          - controller_hosts | length > 0
          - >-
            (vault_demo_ssh_private_key is defined
             and vault_demo_ssh_private_key not in ['', 'CHANGE_ME'])
            or (demo_ssh_private_key_path is file)
          - demo_ai_backend | default('crewai') == 'crewai'
        fail_msg: >-
          Run VM discovery first and configure AAP, SCM, SSH key and CrewAI
          settings before applying CasC. demo_ai_backend must be crewai.

    # Resolve live pod-network addresses in memory, including the AI control VM.
    # Local generated files and the VM's installed CrewAI runtime stay untouched.
    - name: Refresh managed inventory and existing MCP addresses
      ansible.builtin.include_tasks: refresh_inventory_addresses.yml

    - name: Set AAP authentication variables
      ansible.builtin.set_fact:
        aap_token: "{{ vault_aap_token }}"

    - name: Check for an existing GitHub AI incident activation
      ansible.eda.rulebook_activation_info:
        name: GitHub AI Incident Issues
        controller_host: "{{ aap_hostname }}"
        controller_token: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      register: _github_ai_activation_info
      changed_when: false
      no_log: true

    - name: Disable the existing GitHub AI incident activation before CasC
      when: _github_ai_activation_info.activations | length > 0
      ansible.eda.rulebook_activation:
        name: GitHub AI Incident Issues
        organization_name: "{{ demo_organization_name }}"
        state: disabled
        controller_host: "{{ aap_hostname }}"
        controller_token: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      no_log: true

  roles:
    # NOTE: infra.aap_configuration is validated content.
    - role: infra.aap_configuration.dispatch
      tags:
        - aap
