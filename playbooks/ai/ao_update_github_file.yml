---
# Preflight only: pinned reads and semantic validation, with no GitHub writes.
# The caller publishes all validated entries together in one Git tree/commit.
- name: Read the complete variable file at the inspected commit
  ansible.builtin.uri:
    url: >-
      {{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/contents/{{
         _ao_file.path }}?ref={{ _ao_plan.read_commit }}
    method: GET
    headers: "{{ _ao_headers }}"
    return_content: true
    status_code: [200, 404]
  register: _github_current_file
  no_log: true
  tags: [ao, github, validation]

- name: Validate the exact setting changes and preserve unrelated configuration
  ansible.builtin.set_fact:
    _ao_tree: >-
      {{ _ao_tree + [_ao_file | ao_validate_file(_github_current_file,
         _ao_variable_loader | ao_consumed_variables)] }}
  tags: [ao, github, validation]
