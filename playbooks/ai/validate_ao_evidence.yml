---
# Read-only provenance check used by both AO workflows before any success route.
# Uses runtime trace data, never runs agent code or contacts hosts/GitHub.
- name: Validate Automation Orchestrator diagnostic evidence # noqa: fqcn[keyword]
  hosts: localhost
  connection: local
  gather_facts: false
  collections: [ansible.builtin]
  tags: [ao, evidence]
  tasks:
    # Decode inside trusted fixed code, then mark every nested string unsafe.
    # Repository/model data may contain literal Jinja and must never execute here.
    - name: Decode the lossless AO handoff without templating its contents
      ansible.builtin.set_fact:
        _ao_decoded: "{{ ao_payload_b64 | ao_decode_payload }}"
      when: ao_payload_b64 is defined
      no_log: true

    - name: Use the decoded review and evidence objects
      ansible.builtin.set_fact:
        ao_report: "{{ _ao_decoded.ao_report }}"
        ao_plan: "{{ _ao_decoded.ao_plan }}"
        ao_review: "{{ _ao_decoded.ao_review }}"
        ao_evidence: "{{ _ao_decoded.ao_evidence }}"
        ao_evidence_review: "{{ _ao_decoded.ao_evidence_review }}"
        ao_execution_id: "{{ _ao_decoded.ao_execution_id }}"
      when: ao_payload_b64 is defined
      no_log: true

    - name: Compare claimed evidence with successful runtime call results
      ansible.builtin.set_fact:
        _ao_evidence_validation: >-
          {{ (ao_report | default({})) | ao_validate_evidence(
             ao_evidence | default({}), ao_evidence_review | default({}),
             demo_state_scm_url | default('')) }}
      no_log: true

    # Invalid evidence completes this read-only job with valid=false so AO can
    # route to its blocked report. It never invokes the publication playbook.
    - name: Return the deterministic evidence verdict to AO
      ansible.builtin.set_stats:
        data:
          ao_evidence_validation: "{{ _ao_evidence_validation }}"
        per_host: false
