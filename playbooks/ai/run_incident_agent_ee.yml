---
# Run inside the job's CrewAI EE. The VM entrypoint stays available as a fallback.
- name: Run CrewAI incident investigation inside the EE # noqa: fqcn[keyword] - explicit collections policy
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  collections: [ansible.builtin]
  vars:
    _crewai_workflow: incident
  tasks:
    - name: Prepare, execute and clean up the isolated CrewAI job
      ansible.builtin.import_tasks: tasks/run_crewai_ee.yml
      tags: [crewai]
