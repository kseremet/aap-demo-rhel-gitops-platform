---
# Pure preparation between the author and reviewer. Reads only supplied pinned
# files, computes exact typed deltas, and returns blocked on invalid candidates.
# It has no SSH/GitHub credentials and never approves or publishes a proposal.
- name: Prepare exact AO proposal changes for independent review # noqa: fqcn[keyword] - explicit collection policy
  hosts: localhost
  connection: local
  gather_facts: false
  collections: [ansible.builtin]
  tags: [ao, validation]
  tasks:
    - name: Bind immutable evidence and compute the exact candidate deltas
      ansible.builtin.set_fact:
        _ao_proposal: "{{ ao_preparation_b64 | ao_prepare_encoded_proposal }}"
      no_log: true

    - name: Return the complete candidate or explicit blocked reason
      ansible.builtin.set_stats:
        data:
          ao_proposal: "{{ _ao_proposal }}"
        per_host: false
      no_log: true
