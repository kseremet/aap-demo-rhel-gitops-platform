---
# Apply only an independently reviewed AO plan. Read and validate every file
# before creating Git objects, then publish all changes through one commit/ref.
# No task connects to a managed host. Re-apply playbooks/casc.yml before testing.
- name: Publish a reviewed Automation Orchestrator GitOps proposal # noqa: fqcn[keyword]
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - ansible.builtin
  vars_files:
    # Local runs load ignored settings; AAP SCM checkouts use empty fallbacks
    # and receive secrets/settings through credentials and CasC extra_vars.
    - [../../vault.yml, vars/empty.yml]
    - [../../group_vars/all/demo_variables.yml, vars/empty.yml]
  vars:
    github_api_base_url: "{{ demo_ai_github_api_url | default('https://api.github.com') | regex_replace('/+$', '') }}"
    _ao_headers: &github_headers
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ github_api_token }}"
      X-GitHub-Api-Version: "2022-11-28"
  tags: [ao, github]
  tasks:
    - name: Require the reviewed proposal and diagnostic report
      ansible.builtin.assert:
        that:
          - ao_plan is defined
          - ao_report is defined
          - ao_review is defined
          - github_api_token is defined
          - demo_state_scm_url is defined
        fail_msg: Supply ao_plan, ao_report, ao_review, and the configured state repository and credential.
      tags: [validation]

    # Parse data only; never execute strings emitted by an agent. AO's native
    # structured output is an object, but older callbacks can serialize JSON.
    - name: Normalize the three structured workflow handoffs
      ansible.builtin.set_fact:
        _ao_raw_plan: "{{ ao_plan if ao_plan is mapping else (ao_plan | from_json) }}"
        _ao_report: "{{ ao_report if ao_report is mapping else (ao_report | from_json) }}"
        _ao_review: "{{ ao_review if ao_review is mapping else (ao_review | from_json) }}"

    - name: Validate repository identity and the reviewed change contract
      ansible.builtin.set_fact:
        _ao_plan: >-
          {{ _ao_raw_plan | ao_validate_plan(_ao_report, _ao_review,
             demo_state_scm_url, demo_ai_pr_branch_prefix | default('aiops/')) }}
        _ao_tree: []
      tags: [validation]

    - name: Verify the current pull request before a revision
      ansible.builtin.uri:
        url: "{{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/pulls/{{ _ao_plan.pull_request_number }}"
        method: GET
        headers: *github_headers
        return_content: true
        status_code: 200
      register: _ao_existing_pr
      when: _ao_plan.operation == 'update_pr'
      no_log: true

    - name: Require the open PR and the exact inspected head
      ansible.builtin.assert:
        that:
          - _ao_existing_pr.json.state == 'open'
          - _ao_existing_pr.json.head.ref == _ao_plan.branch
          - _ao_existing_pr.json.base.ref == _ao_plan.base_branch
          - _ao_existing_pr.json.head.repo.full_name == _ao_plan.owner ~ '/' ~ _ao_plan.repository
          - _ao_existing_pr.json.head.sha == _ao_plan.read_commit
        fail_msg: PR identity or head changed; inspect the current PR and re-plan.
      when: _ao_plan.operation == 'update_pr'
      tags: [validation]

    # Pin reads to the reviewed commit. Ref changes between investigation and
    # execution fail before any publication; final ref updates also fast-forward.
    - name: Read the current source branch reference
      ansible.builtin.uri:
        url: >-
          {{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/git/ref/heads/{{
             (_ao_plan.base_branch if _ao_plan.operation == 'create_pr' else _ao_plan.branch) | urlencode }}
        method: GET
        headers: *github_headers
        return_content: true
        status_code: 200
      register: _ao_source_ref
      no_log: true

    - name: Reject plans made against a stale branch
      ansible.builtin.assert:
        that:
          - _ao_source_ref.json.object.sha == _ao_plan.read_commit
        fail_msg: The source branch changed after planning; investigate the new revision before writing.
      tags: [validation]

    - name: Read the inspected commit tree
      ansible.builtin.uri:
        url: "{{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/git/commits/{{ _ao_plan.read_commit }}"
        method: GET
        headers: *github_headers
        return_content: true
        status_code: 200
      register: _ao_source_commit
      no_log: true

    - name: Read the existing variable loader at the inspected commit
      ansible.builtin.uri:
        url: >-
          {{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository
          }}/contents/tasks/prepare_vars.yml?ref={{ _ao_plan.read_commit }}
        method: GET
        headers: *github_headers
        return_content: true
        status_code: 200
      register: _ao_variable_loader
      no_log: true

    # This include performs GETs and in-memory comparisons only. A later invalid
    # file cannot leave an earlier file written or an empty branch published.
    - name: Preflight every file and collect a validated Git tree
      ansible.builtin.include_tasks: ao_update_github_file.yml
      loop: "{{ _ao_plan.files }}"
      loop_control:
        loop_var: _ao_file
        label: "{{ _ao_file.path }}"
      tags: [validation]

    - name: Render all diagnostic evidence and future checks for the maintainer
      ansible.builtin.set_fact:
        _ao_pr_body: >-
          {{ _ao_report | ao_render_report(_ao_plan, _ao_review,
             ao_execution_id | default('standalone AAP run')) }}

    # Store the suffix once. Revisions retain the existing head branch; new
    # incidents never accumulate unrelated plans on an older PR's branch.
    - name: Choose a fresh branch for a new proposal
      ansible.builtin.set_fact:
        _ao_plan: >-
          {{ _ao_plan | combine({'branch': _ao_plan.branch ~ '-' ~
             lookup('ansible.builtin.password', '/dev/null', length=20,
                    chars=['ascii_lowercase', 'digits'])}) }}
      when: _ao_plan.operation == 'create_pr'

    - name: Create a tree containing all validated file replacements
      ansible.builtin.uri:
        url: "{{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/git/trees"
        method: POST
        headers: *github_headers
        body_format: json
        body:
          base_tree: "{{ _ao_source_commit.json.tree.sha }}"
          tree: "{{ _ao_tree }}"
        return_content: true
        status_code: 201
      register: _ao_new_tree
      no_log: true

    - name: Create one commit for the complete reviewed proposal
      ansible.builtin.uri:
        url: "{{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/git/commits"
        method: POST
        headers: *github_headers
        body_format: json
        body:
          message: "{{ _ao_plan.commit_message }}"
          tree: "{{ _ao_new_tree.json.sha }}"
          parents: ["{{ _ao_plan.read_commit }}"]
        return_content: true
        status_code: 201
      register: _ao_new_commit
      no_log: true

    - name: Publish a new proposal branch after all validation succeeds
      ansible.builtin.uri:
        url: "{{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/git/refs"
        method: POST
        headers: *github_headers
        body_format: json
        body:
          ref: "refs/heads/{{ _ao_plan.branch }}"
          sha: "{{ _ao_new_commit.json.sha }}"
        status_code: 201
      when: _ao_plan.operation == 'create_pr'
      no_log: true

    # force=false rejects a concurrent divergent PR update, preserving the other
    # author's commit. There are no per-file commits or force pushes.
    - name: Fast-forward the existing PR branch atomically
      ansible.builtin.uri:
        url: "{{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/git/refs/heads/{{ _ao_plan.branch | urlencode }}"
        method: PATCH
        headers: *github_headers
        body_format: json
        body:
          sha: "{{ _ao_new_commit.json.sha }}"
          force: false
        status_code: 200
      when: _ao_plan.operation == 'update_pr'
      no_log: true

    - name: Create or refresh the PR with the complete current report
      ansible.builtin.uri:
        url: >-
          {{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/pulls{{
             '/' ~ (_ao_plan.pull_request_number | string) if _ao_plan.operation == 'update_pr' else '' }}
        method: "{{ 'PATCH' if _ao_plan.operation == 'update_pr' else 'POST' }}"
        headers: *github_headers
        body_format: json
        body: >-
          {{ {'title': _ao_plan.pr_title, 'body': _ao_pr_body}
             | combine({'head': _ao_plan.branch, 'base': _ao_plan.base_branch}
               if _ao_plan.operation == 'create_pr' else {}) }}
        return_content: true
        status_code: "{{ 200 if _ao_plan.operation == 'update_pr' else 201 }}"
      register: _ao_published_pr
      no_log: true

    - name: Record the revision summary without retriggering EDA
      ansible.builtin.uri:
        url: "{{ github_api_base_url }}/repos/{{ _ao_plan.owner }}/{{ _ao_plan.repository }}/issues/{{ _ao_plan.pull_request_number }}/comments"
        method: POST
        headers: *github_headers
        body_format: json
        body:
          body: "{{ _ao_pr_body }}"
        status_code: 201
      when: _ao_plan.operation == 'update_pr'
      no_log: true

    - name: Publish the PR URL and commit as AAP artifacts
      ansible.builtin.set_stats:
        data:
          ao_pull_request_url: "{{ _ao_published_pr.json.html_url }}"
          ao_commit_sha: "{{ _ao_new_commit.json.sha }}"
          ao_branch: "{{ _ao_plan.branch }}"
