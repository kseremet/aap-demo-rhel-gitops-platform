---
# Native HTTP preparation avoids AO's per-script-environment size limit. Allow
# only the existing adapter hostname; preserve every administrator-added host.
- name: Read the AO operator resource for internal handoff access
  kubernetes.core.k8s_info:
    api_version: aap.ansible.com/v1alpha1
    kind: AutomationOrchestrator
    name: "{{ demo_ao_resource_name | default('automation-orchestrator') }}"
    namespace: "{{ demo_ao_namespace | default('automation-orchestrator') }}"
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
  register: _ao_handoff_resource
  tags: [ao, handoffs]
  no_log: true

- name: Require the existing AO operator resource
  ansible.builtin.assert:
    that:
      - _ao_handoff_resource.resources | length == 1
    fail_msg: Configure the AO namespace and resource name before allowing the handoff adapter.
    quiet: true
  tags: [ao, handoffs]
  no_log: true

- name: Allow native HTTP preparation to the existing GitHub MCP adapter
  kubernetes.core.k8s:
    state: patched
    merge_type: [merge]
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
    definition:
      apiVersion: aap.ansible.com/v1alpha1
      kind: AutomationOrchestrator
      metadata:
        name: "{{ demo_ao_resource_name | default('automation-orchestrator') }}"
        namespace: "{{ demo_ao_namespace | default('automation-orchestrator') }}"
      spec:
        workflowHttpRequestAllowedHosts: >-
          {{ ((_ao_handoff_resource.resources[0].spec.workflowHttpRequestAllowedHosts | default([]))
              + [ao_github_text_adapter_url | urlsplit('hostname')]) | unique | list }}
  tags: [ao, handoffs]
  no_log: true

- name: Wait for the AO operator to apply the precise HTTP allowlist
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ demo_ao_resource_name | default('automation-orchestrator') }}-worker"
    namespace: "{{ demo_ao_namespace | default('automation-orchestrator') }}"
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
  register: _ao_handoff_worker
  until:
    - _ao_handoff_worker.resources | length == 1
    - >-
      (ao_github_text_adapter_url | urlsplit('hostname')) in
      (_ao_handoff_worker.resources[0].spec.template.spec.containers
       | selectattr('name', 'equalto', 'worker') | map(attribute='env') | flatten
       | selectattr('name', 'equalto', 'APP_WORKFLOW_HTTP_REQUEST_ALLOWED_HOSTS')
       | map(attribute='value') | first | default('[]') | from_json)
    - _ao_handoff_worker.resources[0].status.observedGeneration | default(0) >= _ao_handoff_worker.resources[0].metadata.generation
    - _ao_handoff_worker.resources[0].status.updatedReplicas | default(0) == _ao_handoff_worker.resources[0].spec.replicas
    - _ao_handoff_worker.resources[0].status.availableReplicas | default(0) == _ao_handoff_worker.resources[0].spec.replicas
    - _ao_handoff_worker.resources[0].status.replicas | default(0) == _ao_handoff_worker.resources[0].spec.replicas
  retries: 36
  delay: 5
  tags: [ao, handoffs]
  no_log: true
