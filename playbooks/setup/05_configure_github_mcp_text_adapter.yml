---
# Configure only the GitHub MCP compatibility endpoint. Does not rotate AO
# service-account credentials or import workflows; use casc.yml to apply all.
- name: Configure the GitHub MCP text compatibility sidecar # noqa: fqcn[keyword] - project requires collections
  hosts: localhost
  connection: local
  gather_facts: false
  collections: [kubernetes.core]
  tags: [ao, github_adapter]
  vars_files:
    - [../../vault.yml, ../ai/vars/empty.yml]
    - [../../group_vars/all/demo_variables.yml, ../ai/vars/empty.yml]
    - ../vars/ao_github_mcp_text_adapter.yml
  tasks:
    - name: Require compatibility mode for this setup entry point
      ansible.builtin.assert:
        that:
          - ao_github_text_adapter_enabled | bool
        fail_msg: Enable demo_ao_github_text_adapter_enabled before configuring its sidecar.

    - name: Configure the GitHub MCP adapter
      ansible.builtin.include_tasks: ../ao_configure_github_mcp_text_adapter.yml
