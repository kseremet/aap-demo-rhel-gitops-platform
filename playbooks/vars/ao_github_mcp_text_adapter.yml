---
# Reuse the GitHub MCP hostname already allowed by AO. Only its integration
# port changes; the AO image, operator configuration, and original MCP port stay.
ao_github_text_adapter_enabled: "{{ demo_ao_github_text_adapter_enabled | default(true) | bool }}"
ao_github_text_adapter_port: "{{ demo_ao_github_text_adapter_port | default(8083) | int }}"
ao_github_text_adapter_image: "{{ demo_ao_github_text_adapter_image | default('registry.access.redhat.com/ubi9/python-312:latest') }}"
ao_github_text_deployment_name: "{{ demo_ao_github_mcp_deployment_name | default('github-mcp-server') }}"
ao_github_text_service_name: "{{ demo_ao_github_mcp_service_name | default('github-mcp-server') }}"
ao_github_text_upstream_container: "{{ demo_ao_github_mcp_container_name | default('github-mcp-server') }}"
ao_github_text_configmap_name: "{{ ao_github_text_deployment_name }}-ao-text"
ao_github_text_adapter_url: >-
  {{ (demo_ao_github_mcp_url | urlsplit('scheme')) ~ '://'
     ~ (demo_ao_github_mcp_url | urlsplit('hostname')) ~ ':'
     ~ (ao_github_text_adapter_port | string) ~ '/mcp' }}
# These fallbacks also support Controller's native Kubernetes bearer credential.
ao_github_text_kube_host: "{{ openshift_api_url | default(lookup('ansible.builtin.env', 'K8S_AUTH_HOST')) }}"
ao_github_text_kube_token: "{{ vault_openshift_token | default(lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY')) }}"
ao_github_text_kube_verify: >-
  {{ openshift_validate_certs | default(
       lookup('ansible.builtin.env', 'K8S_AUTH_VERIFY_SSL') | default('true', true)) | bool }}
# Resolve resources from either the main CasC entry point or numbered setup/cleanup.
ao_github_text_source_file: >-
  {{ lookup('ansible.builtin.first_found', {
       'files': ['../files/ao/github_mcp_text_adapter.py', '../../files/ao/github_mcp_text_adapter.py'],
       'paths': [playbook_dir]}) }}
ao_github_text_sidecar_template: >-
  {{ lookup('ansible.builtin.first_found', {
       'files': ['../templates/ao_github_mcp_text_sidecar.yml.j2', '../../templates/ao_github_mcp_text_sidecar.yml.j2'],
       'paths': [playbook_dir]}) }}
