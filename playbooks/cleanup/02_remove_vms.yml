# Description: Remove the disposable RHEL GitOps VMs from OpenShift.
---
- name: Remove RHEL GitOps VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vault.yml
    - ../../group_vars/all/demo_variables.yml
    - ../../group_vars/all/vm_specs.yml

  tasks:
    - name: Require explicit destruction confirmation
      ansible.builtin.assert:
        that:
          - demo_destroy_confirm | default(false) | bool
        fail_msg: >-
          VM deletion is destructive. Re-run with
          -e demo_destroy_confirm=true.

    # Remove the MCP Secret and workload before deleting the SSH key and VMs.
    - name: Remove the containerized Linux MCP resources
      kubernetes.core.k8s:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ openshift_vm_namespace }}"
        state: absent
        host: "{{ openshift_api_url }}"
        api_key: "{{ vault_openshift_token }}"
        validate_certs: "{{ openshift_validate_certs }}"
      loop:
        - api_version: apps/v1
          kind: Deployment
          name: linux-mcp-server
        - api_version: v1
          kind: Service
          name: linux-mcp-server
        - api_version: v1
          kind: ConfigMap
          name: linux-mcp-server-config
        - api_version: v1
          kind: ConfigMap
          name: linux-mcp-server
        - api_version: v1
          kind: Secret
          name: linux-mcp-server-ssh
        - api_version: v1
          kind: PersistentVolumeClaim
          name: linux-mcp-server-logs
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      tags:
        - cleanup
        - openshift
        - mcp

    - name: Delete KubeVirt VirtualMachines
      kubevirt.core.kubevirt_vm:
        name: "{{ item.value.vm_name }}"
        namespace: "{{ openshift_vm_namespace }}"
        state: absent
        host: "{{ openshift_api_url }}"
        api_key: "{{ vault_openshift_token }}"
        validate_certs: "{{ openshift_validate_certs }}"
        force: true
      loop: "{{ vm_specs | dict2items }}"
      loop_control:
        label: "{{ item.value.vm_name }}"
