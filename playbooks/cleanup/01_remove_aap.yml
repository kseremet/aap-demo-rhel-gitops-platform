# Description: Remove AAP objects created by the platform bootstrap.
---
- name: Remove child AAP objects before the organization
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vault.yml
    - ../../group_vars/all/demo_variables.yml

  pre_tasks:
    - name: Require explicit AAP cleanup confirmation
      ansible.builtin.assert:
        that:
          - demo_aap_cleanup_confirm | default(false) | bool
        fail_msg: >-
          AAP cleanup is destructive. Re-run with
          -e demo_aap_cleanup_confirm=true.

    - name: Set AAP authentication variables
      ansible.builtin.set_fact:
        aap_token: "{{ vault_aap_token }}"

    - name: Check whether the demo organization still exists
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/organizations/?name={{ demo_organization_name | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
        return_content: true
      register: demo_organization_lookup

    - name: Set organization existence fact
      ansible.builtin.set_fact:
        demo_organization_exists: "{{ demo_organization_lookup.json.count | default(0) | int > 0 }}"

  vars:
    aap_organizations: []
    controller_credentials:
      - name: "{{ demo_machine_credential_name }}"
        organization: "{{ demo_organization_name }}"
        credential_type: Machine
        state: absent
    controller_inventories:
      - name: "{{ demo_inventory_name }}"
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: "{{ demo_ai_inventory_name }}"
        organization: "{{ demo_organization_name }}"
        state: absent
    controller_projects:
      - name: "{{ demo_state_project_name }}"
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: "{{ demo_platform_project_name }}"
        organization: "{{ demo_organization_name }}"
        state: absent
    controller_templates:
      - name: JT - RHEL GitOps Reconciliation
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - RHEL GitOps Provision VMs
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - RHEL GitOps Discover Inventory
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - RHEL GitOps Cleanup
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - AI Incident Investigation
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - AI PR Review
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - AI Incident Investigation (VM fallback)
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - AI PR Review (VM fallback)
        organization: "{{ demo_organization_name }}"
        state: absent
      - name: JT - AI EE Verification
        organization: "{{ demo_organization_name }}"
        state: absent
    eda_rulebook_activations:
      - name: GitHub AI Incident Issues
        organization: "{{ demo_organization_name }}"
        state: absent
    eda_projects:
      - name: "{{ demo_eda_project_name }}"
        organization: "{{ demo_organization_name }}"
        state: absent
    eda_credentials:
      - name: "{{ demo_eda_controller_credential_name }}"
        organization: "{{ demo_organization_name }}"
        state: absent

  tasks:
    - name: Remove child AAP objects
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      when: demo_organization_exists | bool
      tags: [cleanup]

    # Delete only the EE objects declared for this demo, after their job templates.
    # These are absent before the first EE cutover; VM resources are handled above.
    - name: Remove the demo CrewAI execution environment
      ansible.controller.execution_environment:
        name: "{{ demo_execution_environment_name | default('RHEL GitOps CrewAI EE') }}"
        organization: "{{ demo_organization_name }}"
        state: absent
        controller_host: "{{ aap_hostname }}"
        controller_oauthtoken: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      when: demo_organization_exists | bool
      tags: [cleanup]

    # A custom type is global; look it up before deleting its credential.
    - name: Look up the CrewAI API credential type before removing it
      ansible.builtin.uri:
        url: >-
          {{ aap_hostname | regex_replace('^(?!https?://)', 'https://') | regex_replace('/+$', '')
          }}/api/controller/v2/credential_types/?name=CrewAI%20API%20Tokens
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      register: _crewai_cleanup_type
      when: demo_organization_exists | bool
      no_log: true
      tags: [cleanup]

    - name: Remove the demo CrewAI API credential
      ansible.controller.credential:
        credential_type: CrewAI API Tokens
        name: "{{ demo_ai_api_credential_name | default('RHEL GitOps CrewAI API Tokens') }}"
        organization: "{{ demo_organization_name }}"
        state: absent
        controller_host: "{{ aap_hostname }}"
        controller_oauthtoken: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      when:
        - demo_organization_exists | bool
        - _crewai_cleanup_type.json.count == 1
      tags: [cleanup]

    - name: Remove the optional demo registry credential
      ansible.controller.credential:
        credential_type: Container Registry
        name: "{{ hub_registry_credential_name | default('PAH Container Registry') }}"
        organization: "{{ demo_organization_name }}"
        state: absent
        controller_host: "{{ aap_hostname }}"
        controller_oauthtoken: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      when:
        - demo_organization_exists | bool
        - demo_ee_registry_auth | default(false) | bool
      tags: [cleanup]

    - name: Check whether any credentials still use the global CrewAI type
      ansible.builtin.uri:
        url: >-
          {{ aap_hostname | regex_replace('^(?!https?://)', 'https://') | regex_replace('/+$', '')
          }}/api/controller/v2/credentials/?credential_type={{ _crewai_cleanup_type.json.results[0].id }}&page_size=1
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      register: _crewai_cleanup_users
      when:
        - demo_organization_exists | bool
        - _crewai_cleanup_type.json.count == 1
      no_log: true
      tags: [cleanup]

    - name: Remove the unused CrewAI API credential type
      ansible.controller.credential_type:
        name: CrewAI API Tokens
        state: absent
        controller_host: "{{ aap_hostname }}"
        controller_oauthtoken: "{{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
      when:
        - demo_organization_exists | bool
        - _crewai_cleanup_type.json.count == 1
        - _crewai_cleanup_users.json.count == 0
      tags: [cleanup]

- name: Remove the demo AAP organization
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vault.yml
    - ../../group_vars/all/demo_variables.yml

  pre_tasks:
    - name: Set AAP authentication variables
      ansible.builtin.set_fact:
        aap_token: "{{ vault_aap_token }}"

  vars:
    aap_organizations:
      - name: "{{ demo_organization_name }}"
        state: absent

  roles:
    - role: infra.aap_configuration.dispatch
      tags: [cleanup]
