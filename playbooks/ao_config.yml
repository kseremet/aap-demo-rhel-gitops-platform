# Description: Configure Automation Orchestrator with the demo project and
# version-controlled agentic workflows. Run after the AO instance is available.
# This playbook uses the local admin login only for AO configuration. It also
# rotates the disposable EDA service-account credential used by the AAP bridge.
---
- name: Configure Automation Orchestrator workflows
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vault.yml
    - ../group_vars/all/demo_variables.yml
  vars:
    ao_api_base_url: "{{ demo_ao_url | regex_replace('/+$', '') }}/api/v1"
    ao_workflow_definitions:
      - name: rhel-gitops-incident-investigation
        path: "{{ playbook_dir }}/../workflows/automation-orchestrator/rhel-gitops-incident.yaml"
        webhook_path: "{{ demo_ao_incident_eda_trigger_path }}"
      - name: rhel-gitops-pr-review
        path: "{{ playbook_dir }}/../workflows/automation-orchestrator/rhel-gitops-pr-review.yaml"
        webhook_path: "{{ demo_ao_pr_review_eda_trigger_path }}"
    ao_eda_service_account_name: RHEL GitOps EDA Trigger
    ao_integrations:
      - name: "{{ demo_ao_aap_integration_name }}"
        integration_type: ansible_automation_platform
        credential_type_name: Ansible Automation Platform
        credential_inputs:
          oauth_token: "{{ vault_aap_token }}"
        configuration:
          integration_type: ansible_automation_platform
          base_url: >-
            {{ aap_hostname | regex_replace('^(?!https?://)', 'https://')
               | regex_replace('/+$', '') }}
          insecure_skip_tls_verify: "{{ not (aap_validate_certs | bool) }}"
        refresh: false
      - name: "{{ demo_ao_llm_integration_name }}"
        integration_type: llm_provider
        credential_type_name: LLM Provider
        credential_inputs:
          api_key: "{{ vault_ai_llm_api_key }}"
        configuration:
          integration_type: llm_provider
          provider_hint: "{{ demo_ai_llm_provider }}"
          base_url: "{{ demo_ai_llm_base_url }}"
          insecure_skip_tls_verify: false
        refresh: true
      - name: "{{ demo_ao_mcp_integration_name }}"
        integration_type: mcp_server
        credential_type_name: ""
        credential_inputs: {}
        configuration:
          integration_type: mcp_server
          base_url: "{{ demo_ao_mcp_url }}"
          allow_http: true
          insecure_skip_tls_verify: true
        refresh: true
  tasks:
    - name: Validate Automation Orchestrator configuration inputs
      ansible.builtin.assert:
        that:
          - demo_ao_url is defined
          - demo_ao_url != 'CHANGE_ME_AUTOMATION_ORCHESTRATOR_URL'
          - demo_ao_username | default('admin') | length > 0
          - vault_ao_admin_password is defined
          - vault_ao_admin_password not in ['', 'CHANGE_ME']
          - demo_ao_project_name | length > 0
        fail_msg: Configure the AO URL, admin password, and project name before running ao_config.yml.
      no_log: true
      tags:
        - ao
        - validation

    - name: Authenticate to Automation Orchestrator as the local admin
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ demo_ao_username | default('admin') }}"
          password: "{{ vault_ao_admin_password }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_login
      no_log: true
      tags:
        - ao
        - authentication

    - name: Resolve the AO access token
      ansible.builtin.set_fact:
        ao_access_token: "{{ _ao_login.json.access_token }}"
      no_log: true
      tags:
        - ao
        - authentication

    - name: Find the demo AO project
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/projects?name={{ demo_ao_project_name | urlencode }}&limit=100"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_projects
      no_log: true
      tags:
        - ao
        - project

    - name: Create the demo AO project when absent
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/projects"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        body_format: json
        body:
          name: "{{ demo_ao_project_name }}"
          description: RHEL GitOps agentic workflows managed by Ansible.
          labels:
            managed_by: ansible
            demo: rhel-gitops
        status_code: 201
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_created_project
      changed_when: true
      when: >-
        (_ao_projects.json.resources | default([])
         | selectattr('name', 'equalto', demo_ao_project_name) | list | length) == 0
      no_log: true
      tags:
        - ao
        - project

    - name: Resolve the demo AO project ID
      ansible.builtin.set_fact:
        ao_project_id: >-
          {{ _ao_created_project.json.id
             if (_ao_created_project is defined and _ao_created_project.json is defined)
             else ((_ao_projects.json.resources
                    | selectattr('name', 'equalto', demo_ao_project_name)
                    | list | first).id) }}
      no_log: true
      tags:
        - ao
        - project

    - name: List AO service accounts
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/service_accounts?limit=100"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_service_accounts
      changed_when: false
      no_log: true
      tags:
        - ao
        - service_account

    - name: Resolve the AO EDA service account
      ansible.builtin.set_fact:
        _ao_existing_service_account: >-
          {{ _ao_service_accounts.json.resources | default([])
             | selectattr('name', 'equalto', ao_eda_service_account_name)
             | selectattr('project_id', 'equalto', ao_project_id)
             | list | first | default({}) }}
      changed_when: false
      no_log: true
      tags:
        - ao
        - service_account

    - name: Create the AO EDA service account when absent
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/service_accounts"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        body_format: json
        body:
          name: "{{ ao_eda_service_account_name }}"
          description: Service account used by AAP EDA to trigger GitOps workflows.
          project_id: "{{ ao_project_id }}"
        status_code: 201
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_created_service_account
      when: _ao_existing_service_account.id is not defined
      no_log: true
      tags:
        - ao
        - service_account

    - name: Resolve the AO EDA service account ID
      ansible.builtin.set_fact:
        ao_eda_service_account_id: >-
          {{ _ao_created_service_account.json.id
             if (_ao_created_service_account is defined and _ao_created_service_account.json is defined)
             else _ao_existing_service_account.id }}
      changed_when: false
      no_log: true
      tags:
        - ao
        - service_account

    - name: List credentials for the AO EDA service account
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/service_accounts/{{ ao_eda_service_account_id }}/credentials?limit=100"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        status_code: 200
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_service_account_credentials
      changed_when: false
      no_log: true
      tags:
        - ao
        - service_account

    - name: Create the AO EDA client credential when absent
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/service_accounts/{{ ao_eda_service_account_id }}/credentials"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        body_format: json
        body:
          credential_type: client_credentials
        status_code: 201
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_created_service_account_credential
      when: (_ao_service_account_credentials.json.resources | default([]) | length) == 0
      no_log: true
      tags:
        - ao
        - service_account

    - name: Rotate the existing AO EDA client credential
      ansible.builtin.uri:
        url: >-
          {{ ao_api_base_url }}/service_accounts/{{ ao_eda_service_account_id }}/credentials/
          {{ (_ao_service_account_credentials.json.resources | first).id }}/rotate
        method: POST
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        body_format: json
        body:
          grace_period_seconds: 3600
        status_code: 200
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      register: _ao_rotated_service_account_credential
      when: (_ao_service_account_credentials.json.resources | default([]) | length) > 0
      no_log: true
      tags:
        - ao
        - service_account

    - name: Resolve the current AO EDA client credentials
      ansible.builtin.set_fact:
        ao_eda_client_id: >-
          {{ (_ao_created_service_account_credential.json
              if (_ao_created_service_account_credential is defined and _ao_created_service_account_credential.json is defined)
              else _ao_rotated_service_account_credential.json).identifier }}
        ao_eda_client_secret: >-
          {{ (_ao_created_service_account_credential.json
              if (_ao_created_service_account_credential is defined and _ao_created_service_account_credential.json is defined)
              else _ao_rotated_service_account_credential.json).client_secret }}
      no_log: true
      tags:
        - ao
        - service_account

    - name: Assign the AO workflow-executor role to the EDA service account
      ansible.builtin.uri:
        url: "{{ ao_api_base_url }}/role_assignments"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_access_token }}"
        body_format: json
        body:
          principal_id: "{{ ao_eda_service_account_id }}"
          role_name: workflow-executor
          project_id: "{{ ao_project_id }}"
        status_code: [201, 409]
        return_content: true
        validate_certs: "{{ demo_ao_validate_certs }}"
      no_log: true
      tags:
        - ao
        - service_account

    - name: Create or reconcile AO project integrations and credentials
      ansible.builtin.include_tasks: ao_ensure_integration.yml
      loop: "{{ ao_integrations }}"
      loop_control:
        loop_var: ao_integration
        label: "{{ ao_integration.name }}"
      tags:
        - ao
        - integrations

    - name: Validate discovered AO integration resources
      ansible.builtin.assert:
        that:
          - ao_aap_integration_id is defined
          - ao_aap_credential_id is defined
          - ao_aap_credential_id is not none
          - ao_aap_credential_id | string != 'None'
          - ao_llm_integration_id is defined
          - ao_llm_credential_id is defined
          - ao_llm_credential_id is not none
          - ao_llm_credential_id | string != 'None'
          - ao_llm_model_id is defined
          - ao_mcp_integration_id is defined
        fail_msg: >-
          AO integrations or the configured LLM model could not be discovered.
          Check the AAP/LLM/MCP endpoints and AO's internal MCP hostname allowlist.
      no_log: true
      tags:
        - ao
        - integrations

    - name: Import or update the version-controlled AO workflows
      ansible.builtin.include_tasks: ao_import_workflow.yml
      loop: "{{ ao_workflow_definitions }}"
      loop_control:
        loop_var: ao_workflow
        label: "{{ ao_workflow.name }}"
      tags:
        - ao
        - workflows
