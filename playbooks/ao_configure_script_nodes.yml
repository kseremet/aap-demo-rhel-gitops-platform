---
# Explicit opt-in only. AO labels script execution Developer Preview: enabling
# it lets every authorized workflow author/runner execute code on its workers.
# The admin ConfigMap is already referenced by the operator-managed Deployment.
- name: Read the AO workflow worker configuration
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ demo_ao_resource_name | default('automation-orchestrator') }}-worker"
    namespace: "{{ demo_ao_namespace | default('automation-orchestrator') }}"
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
  register: _ao_script_worker
  tags: [ao, script_nodes]
  no_log: true

- name: Require the operator-provided admin settings ConfigMap reference
  ansible.builtin.assert:
    that:
      - _ao_script_worker.resources | length == 1
      - >-
        (_ao_script_worker.resources[0].spec.template.spec.containers
         | selectattr('name', 'equalto', 'worker') | map(attribute='envFrom')
         | flatten | selectattr('configMapRef', 'defined')
         | map(attribute='configMapRef.name')
         | select('equalto', (demo_ao_resource_name | default('automation-orchestrator')) ~ '-admin-settings')
         | list | length) == 1
    fail_msg: The configured AO worker does not expose the expected admin-settings ConfigMap.
    quiet: true
  tags: [ao, script_nodes]
  no_log: true

- name: Configure the explicitly approved script-node setting
  kubernetes.core.k8s:
    state: present
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ demo_ao_resource_name | default('automation-orchestrator') }}-admin-settings"
        namespace: "{{ demo_ao_namespace | default('automation-orchestrator') }}"
      data:
        APP_SCRIPT_NODES_ENABLED: "{{ (demo_ao_script_nodes_enabled | default(true) | bool) | ternary('true', 'false') }}"
  tags: [ao, script_nodes]
  no_log: true

# A stable annotation rolls workers only when the declared flag changes. Keep
# all other Pod configuration, image references and operator ownership intact.
- name: Roll AO workflow workers when the script-node setting changes
  kubernetes.core.k8s:
    state: patched
    merge_type: [strategic-merge]
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ demo_ao_resource_name | default('automation-orchestrator') }}-worker"
        namespace: "{{ demo_ao_namespace | default('automation-orchestrator') }}"
      spec:
        template:
          metadata:
            annotations:
              aap-workbench.script-nodes-enabled: "{{ (demo_ao_script_nodes_enabled | default(true) | bool) | ternary('true', 'false') }}"
  tags: [ao, script_nodes]
  no_log: true

- name: Wait for the configured AO workflow workers
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ demo_ao_resource_name | default('automation-orchestrator') }}-worker"
    namespace: "{{ demo_ao_namespace | default('automation-orchestrator') }}"
    host: "{{ openshift_api_url }}"
    api_key: "{{ vault_openshift_token }}"
    validate_certs: "{{ openshift_validate_certs }}"
  register: _ao_script_ready
  until:
    - _ao_script_ready.resources | length == 1
    - _ao_script_ready.resources[0].status.observedGeneration | default(0) >= _ao_script_ready.resources[0].metadata.generation
    - _ao_script_ready.resources[0].status.updatedReplicas | default(0) == _ao_script_ready.resources[0].spec.replicas
    - _ao_script_ready.resources[0].status.availableReplicas | default(0) == _ao_script_ready.resources[0].spec.replicas
    - _ao_script_ready.resources[0].status.replicas | default(0) == _ao_script_ready.resources[0].spec.replicas
    - _ao_script_ready.resources[0].status.unavailableReplicas | default(0) == 0
  retries: 36
  delay: 5
  tags: [ao, script_nodes]
  no_log: true
