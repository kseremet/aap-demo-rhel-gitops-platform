---
# Apply Controller/EDA configuration and reconcile the deployed CrewAI scripts.
# Initial VM/package setup stays separate; runtime updates reconcile the shared
# model while preserving credentials, core packages, checkout and external MCP.
- name: Configure the RHEL GitOps AAP and CrewAI event path
  ansible.builtin.import_playbook: aap_config.yml

- name: Reconcile the internal Phoenix dashboard before enabling tracing
  ansible.builtin.import_playbook: setup/05_configure_phoenix.yml

- name: Reconcile the CrewAI runtime from the same source templates
  ansible.builtin.import_playbook: setup/update_crewai_runtime.yml
