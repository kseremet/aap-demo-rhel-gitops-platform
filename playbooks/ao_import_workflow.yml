---
- name: Load the version-controlled AO workflow definition
  ansible.builtin.set_fact:
    _ao_workflow_definition: "{{ lookup('ansible.builtin.file', ao_workflow.path) | from_yaml }}"
  no_log: true

- name: Set the concrete unauthenticated EDA trigger configuration
  ansible.builtin.set_fact:
    _ao_trigger: >-
      {{ _ao_workflow_definition.triggers[0]
         | combine({'parameters':
             (_ao_workflow_definition.triggers[0].parameters
              | combine({'webhook_path': ao_workflow.webhook_path,
                         'authorized_service_account_ids': []}))}) }}
  no_log: true

- name: Apply the concrete EDA trigger configuration to the workflow
  ansible.builtin.set_fact:
    _ao_workflow_definition: >-
      {{ _ao_workflow_definition
         | combine({'triggers': [_ao_trigger]}, recursive=True) }}
  no_log: true

- name: Inject discovered project integration and model IDs
  ansible.builtin.set_fact:
    _ao_workflow_definition: >-
      {{ (_ao_workflow_definition | to_json
          | replace('__AO_LLM_MODEL_ID__', ao_llm_model_id)
          | replace('__AO_LLM_CREDENTIAL_ID__', ao_llm_credential_id)
          | replace('__AO_AAP_INTEGRATION_ID__', ao_aap_integration_id)
          | replace('__AO_AAP_CREDENTIAL_ID__', ao_aap_credential_id)
          | replace('__AO_MCP_INTEGRATION_ID__', ao_mcp_integration_id)) | from_json }}
  no_log: true

- name: Look up an existing AO workflow with the same name
  ansible.builtin.uri:
    url: "{{ ao_api_base_url }}/workflows?limit=100"
    method: GET
    headers:
      Authorization: "Bearer {{ ao_access_token }}"
    status_code: 200
    return_content: true
    validate_certs: "{{ demo_ao_validate_certs }}"
  register: _ao_workflows
  changed_when: false
  no_log: true

- name: Resolve the existing AO workflow record
  ansible.builtin.set_fact:
    _ao_existing_workflow: >-
      {{ _ao_workflows.json.resources | default([])
         | selectattr('name', 'equalto', ao_workflow.name) | list | first
         | default({}) }}
  changed_when: false
  no_log: true

- name: Read the current AO workflow definition
  ansible.builtin.uri:
    url: "{{ ao_api_base_url }}/workflows/{{ _ao_existing_workflow.id }}?include=workflow_definition"
    method: GET
    headers:
      Authorization: "Bearer {{ ao_access_token }}"
    status_code: 200
    return_content: true
    validate_certs: "{{ demo_ao_validate_certs }}"
  register: _ao_existing_workflow_detail
  changed_when: false
  when: _ao_existing_workflow.id is defined
  no_log: true

- name: Create the AO workflow when absent
  ansible.builtin.uri:
    url: "{{ ao_api_base_url }}/workflows"
    method: POST
    headers:
      Authorization: "Bearer {{ ao_access_token }}"
    body_format: json
    body:
      name: "{{ ao_workflow.name }}"
      description: "{{ _ao_workflow_definition.description | default('') }}"
      project_id: "{{ ao_project_id }}"
      workflow_definition: "{{ _ao_workflow_definition }}"
      is_import: true
    status_code: 201
    return_content: true
    validate_certs: "{{ demo_ao_validate_certs }}"
  changed_when: true
  when: >-
    (_ao_workflows.json.resources | default([])
     | selectattr('name', 'equalto', ao_workflow.name) | list | length) == 0
  no_log: true

- name: Update the existing AO workflow definition
  ansible.builtin.uri:
    url: "{{ ao_api_base_url }}/workflows/{{ _ao_existing_workflow.id }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ ao_access_token }}"
    body_format: json
    body:
      workflow_definition: "{{ _ao_workflow_definition }}"
      expected_version: "{{ _ao_existing_workflow_detail.json.current_version }}"
      change_description: Managed by playbooks/ao_config.yml.
    status_code: 200
    return_content: true
    validate_certs: "{{ demo_ao_validate_certs }}"
  changed_when: true
  when: >-
    _ao_existing_workflow.id is defined and
    (_ao_existing_workflow_detail.json.version.workflow_definition | default({}))
    != _ao_workflow_definition
  # The request contains only workflow metadata and UUID references; expose AO
  # validation failures instead of masking a non-secret API response.
  no_log: false
