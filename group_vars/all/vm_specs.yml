---
# Desired VM shape belongs to the platform repository.
vm_specs:
  web-01:
    vm_name: web-01-gitops
    group: web_servers
    role: web_server
    cpu_cores: 2
    memory: 2Gi
    data_disks:
      - name: disk-data
        serial: data-disk01
        size: 5Gi
      - name: disk-web
        serial: web-disk01
        size: 10Gi
  web-02:
    vm_name: web-02-gitops
    group: web_servers
    role: web_server
    cpu_cores: 2
    memory: 2Gi
    data_disks:
      - name: disk-data
        serial: data-disk01
        size: 5Gi
      - name: disk-web
        serial: web-disk01
        size: 10Gi
  db-01:
    vm_name: db-01-gitops
    group: database_servers
    role: database_server
    cpu_cores: 2
    memory: 4Gi
    data_disks:
      - name: disk-data
        serial: data-disk01
        size: 5Gi
      - name: disk-db
        serial: db-disk01
        size: 50Gi
  app-01:
    vm_name: app-01-gitops
    group: app_servers
    role: app_server
    cpu_cores: 2
    memory: 4Gi
    data_disks:
      - name: disk-data
        serial: data-disk01
        size: 5Gi
      - name: disk-app
        serial: app-disk01
        size: 20Gi
