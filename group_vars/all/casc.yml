---
aap_organizations:
  - name: "{{ demo_organization_name }}"
    description: RHEL GitOps event demonstration

controller_credentials:
  - name: "{{ demo_machine_credential_name }}"
    organization: "{{ demo_organization_name }}"
    credential_type: Machine
    inputs:
      username: cloud-user
      ssh_key_data: >-
        {{ vault_demo_ssh_private_key
           if vault_demo_ssh_private_key is defined
              and vault_demo_ssh_private_key not in ['', 'CHANGE_ME']
           else lookup('ansible.builtin.file', demo_ssh_private_key_path) }}
    no_log: true
  - name: GitHub API Access
    description: GitHub token used by the Automation Orchestrator GitOps action job.
    organization: "{{ demo_organization_name }}"
    credential_type: GitHub API Token
    inputs:
      github_token: "{{ vault_github_token }}"
    no_log: true
  - name: Automation Orchestrator Service Account
    description: Client credentials used by EDA to trigger AO workflows.
    organization: "{{ demo_organization_name }}"
    credential_type: Automation Orchestrator Service Account
    inputs:
      client_id: "{{ ao_eda_client_id }}"
      client_secret: "{{ ao_eda_client_secret }}"
    no_log: true
controller_credential_types:
  - name: GitHub API Token
    description: Token injected into GitHub API action jobs.
    kind: cloud
    inputs:
      fields:
        - id: github_token
          type: string
          label: GitHub API token
          secret: true
      required:
        - github_token
    injectors:
      extra_vars:
        github_api_token: "{{ '{{ github_token }}' }}"
  - name: Automation Orchestrator Service Account
    description: Client credentials used by EDA to trigger AO workflows.
    kind: cloud
    inputs:
      fields:
        - id: client_id
          type: string
          label: AO client ID
          secret: false
        - id: client_secret
          type: string
          label: AO client secret
          secret: true
      required:
        - client_id
        - client_secret
    injectors:
      extra_vars:
        ao_webhook_client_id: "{{ '{{ client_id }}' }}"
        ao_webhook_client_secret: "{{ '{{ client_secret }}' }}"

controller_inventories:
  - name: "{{ demo_inventory_name }}"
    organization: "{{ demo_organization_name }}"
    variables:
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  - name: "{{ demo_ai_inventory_name }}"
    organization: "{{ demo_organization_name }}"
    variables:
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

controller_projects:
  - name: "{{ demo_state_project_name }}"
    organization: "{{ demo_organization_name }}"
    scm_type: git
    scm_url: "{{ demo_state_scm_url }}"
    scm_branch: "{{ demo_state_scm_branch }}"
    scm_update_on_launch: true
  - name: "{{ demo_platform_project_name }}"
    organization: "{{ demo_organization_name }}"
    scm_type: git
    scm_url: "{{ demo_platform_scm_url }}"
    scm_branch: "{{ demo_platform_scm_branch }}"
    scm_update_on_launch: true

controller_templates:
  - name: JT - RHEL GitOps Reconciliation
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_state_project_name }}"
    playbook: site.yml
    credentials:
      - "{{ demo_machine_credential_name }}"
  - name: JT - RHEL GitOps Provision VMs
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_platform_project_name }}"
    playbook: playbooks/setup/02_provision_vms.yml
  - name: JT - RHEL GitOps Discover Inventory
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_platform_project_name }}"
    playbook: playbooks/setup/03_discover_inventory.yml
  - name: JT - RHEL GitOps Cleanup
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_platform_project_name }}"
    playbook: playbooks/cleanup.yml
    survey_enabled: true
  - name: JT - AI Incident Investigation
    description: Investigate an incident on the AI control VM and propose a GitHub pull request.
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_ai_inventory_name }}"
    project: "{{ demo_platform_project_name }}"
    playbook: playbooks/ai/run_incident_agent.yml
    credentials:
      - "{{ demo_machine_credential_name }}"
    survey_enabled: true
    survey_spec:
      name: AI incident investigation
      description: Incident prompt passed to the CrewAI investigation workflow.
      spec:
        - question_name: Incident description
          question_description: Describe the issue for the CrewAI investigation workflow.
          type: textarea
          variable: ai_incident_prompt
          required: true
          min: 1
          max: 4096
          default: >-
            Investigate web-01 because net.core.somaxconn appears inconsistent
            with the web-server policy. Determine the root cause and propose a
            GitOps remediation pull request. Do not modify the host directly.
          choices: ""
          new_question: true
  - name: JT - AI PR Review
    description: Process maintainer feedback on an AI-generated GitHub pull request.
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_ai_inventory_name }}"
    project: "{{ demo_platform_project_name }}"
    playbook: playbooks/ai/run_pr_review_agent.yml
    credentials:
      - "{{ demo_machine_credential_name }}"
    ask_variables_on_launch: true
  - name: JT - AO Event Bridge
    description: Forward an EDA event to an Automation Orchestrator EDA trigger.
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_ai_inventory_name }}"
    project: "{{ demo_platform_project_name }}"
    playbook: playbooks/ai/forward_event_to_ao.yml
    extra_vars:
      ao_webhook_base_url: "{{ demo_ao_url }}"
    credentials:
      - Automation Orchestrator Service Account
  - name: JT - AO GitOps Action
    description: Create or update a GitHub pull request from an AO structured plan.
    organization: "{{ demo_organization_name }}"
    job_type: run
    inventory: "{{ demo_ai_inventory_name }}"
    project: "{{ demo_platform_project_name }}"
    playbook: playbooks/ai/run_ao_gitops_action.yml
    ask_variables_on_launch: true
    credentials:
      - GitHub API Access

eda_credentials:
  - name: "{{ demo_eda_controller_credential_name }}"
    description: EDA credential for launching the AI incident job template.
    credential_type: Red Hat Ansible Automation Platform
    organization: "{{ demo_organization_name }}"
    inputs:
      host: >-
        {{ aap_hostname
           | regex_replace('^(?!https?://)', 'https://')
           | regex_replace('/+$', '') }}/api/controller/
      oauth_token: "{{ vault_aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

eda_projects:
  - name: "{{ demo_eda_project_name }}"
    description: Rulebooks for the RHEL GitOps AI incident workflow.
    url: "{{ demo_platform_scm_url }}"
    scm_branch: "{{ demo_platform_scm_branch }}"
    organization: "{{ demo_organization_name }}"

eda_rulebook_activations:
  - name: GitHub AI Incident Issues
    description: Launch the AI investigation job for labeled GitHub issues.
    organization: "{{ demo_organization_name }}"
    project: "{{ demo_eda_project_name }}"
    rulebook: github_incidents.yml
    decision_environment: "{{ demo_eda_decision_environment_name }}"
    eda_credentials:
      - "{{ demo_eda_controller_credential_name }}"
    extra_vars:
      github_webhook_port: "{{ demo_eda_webhook_port }}"
      github_webhook_secret: "{{ vault_github_webhook_secret }}"
      github_incident_label: "{{ demo_eda_incident_label }}"
      github_aap_organization: "{{ demo_organization_name }}"
      ai_backend: "{{ demo_ai_backend }}"
      ao_incident_webhook_path: "{{ demo_ao_incident_eda_trigger_path }}"
      ao_pr_review_webhook_path: "{{ demo_ao_pr_review_eda_trigger_path }}"
    restart_policy: always
    enabled: true
    state: present
