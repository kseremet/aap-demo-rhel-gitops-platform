      sources (host, or repository/path/ref/blob SHA). Separate facts, hypotheses,
      policy requirements, and future validation. Do not invent missing evidence.

      Return outcome=blocked. Explain that the reviewer exceeded the four-check budget, preserve the evidence, and list focused next steps. No writer was invoked.
      Review:
      ${review_evidence.result.content}
      Analysis:
      ${analyze_case.result.content}

      Final handoff: State the no-write outcome and its explanation. Retain the supporting evidence
      and concrete next steps, including missing evidence or corrections required.
      Use the configured response schema.
      For every evidence item, copy tool_output_excerpt verbatim from the successful tool output and use the exact callable tool name. Failed calls and upstream prose are not evidence.
      Do not add ellipses or alter whitespace inside excerpts. For a scalar result,
      copy the complete trimmed value. Use tool names without the functions. prefix.
      For a JSON result, a JSON object containing only unchanged returned fields is
      also accepted; do not invent keys or values. Leave evidence empty when no successful results support a claim.
  settings:
    timeout: 1200
    continue_on_failure: false
