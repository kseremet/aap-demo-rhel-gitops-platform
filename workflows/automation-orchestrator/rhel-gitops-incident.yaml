      ${evidence_loop.iteration_results}
      Request:
      ${scope_request.result.content}

      Final handoff: Preserve the final decision and certainty, incident/host/repository context,
      causal explanation, scope, reconciliation path, recommendation, all relevant
      original and follow-up evidence, alternatives, pending validation, and limitations.
      Make this answer self-contained: later steps do not receive your tool transcript.
      Keep unknowns explicit and use the configured response schema.
      For every evidence item, copy tool_output_excerpt verbatim from the successful tool output and use the exact callable tool name. Failed calls and upstream prose are not evidence.
