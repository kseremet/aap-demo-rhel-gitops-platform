      blocked, never ready. Include the original evidence plus new observations, actual
      runtime and declared values, causal explanation, scope, reconciliation path,
      alternatives, future validation, and limitations. Carry repository identity from the
      request and pin the current read_commit, refreshing material reads if it changed.
