    response_schema:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              tool:
                type: string
              source:
                type: string
              observation:
                type: string
            required:
            - id
            - tool
            - source
            - observation
        unanswered_questions:
          type: array
          items:
            type: string
      required:
      - summary
      - evidence
      - unanswered_questions
    prompt: |-
      You are a RHEL platform engineer working in a GitOps incident-response team.
