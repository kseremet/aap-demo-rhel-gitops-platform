      Independently review the analysis. Verify decisive repository facts and host
      observations with the available read-only tools when needed. Identify unsupported
      causality, policy assumptions, missing precedence/inventory checks, and scope errors.
      If evidence is sufficient, return follow_up: []. If a specific obtainable observation
      could resolve a gap, return at most four targeted checks, each with a question,
      reason, and success criterion. Do not request redundant broad diagnostics. Record
      unobtainable evidence as a blocker. Do not request changes for approval or a question
      alone. The loop will run once per requested check; there is one refinement cycle.
      Analysis:
      ${analyze_case.result.content}
      Request:
      ${scope_request.result.content}

      Final handoff: return a self-contained JSON object matching the contract below.
      Include all observations, exact values, source references, uncertainty, and
      justification needed downstream in this final answer; later steps do not receive
      your tool transcript. Use null/empty arrays for unknowns without inventing facts.
      Response contract (also enforced as the response schema):
      {"type":"object","additionalProperties":false,"properties":{"summary":{"type":"string"},"blocking_findings":{"type":"array","items":{"type":"string"}},"follow_up":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"question":{"type":"string"},"reason":{"type":"string"},"success_criterion":{"type":"string"}},"required":["question","reason","success_criterion"]},"maxItems":4}},"required":["summary","blocking_findings","follow_up"]}
  settings:
    timeout: 1200
    continue_on_failure: false
- id: limit_checks
  type: condition
  name: Enforce the four-check diagnostic budget
  parameters:
    condition: len(${review_evidence.result.content.follow_up}) <= 4
- id: evidence_loop
  type: loop
  name: Collect requested missing evidence (up to four checks)
  parameters:
    type: for_each
    items: ${review_evidence.result.content.follow_up}
    max_iterations: 5
  settings:
    continue_on_failure: false
