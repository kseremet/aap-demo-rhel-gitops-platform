      Use GitHub MCP to inspect the entry playbook, inventory/group membership,
      variable loader, and all relevant baseline/group/host overlays at the pinned
      revision. Prove which role/task consumes each candidate setting and how precedence
      selects its effective value. Distinguish commented examples from active declarations.
      For PR feedback inspect the PR head, not a local or base-branch copy. Provide
      paths/ref/blob SHAs, exact declared values, consuming variable names and role,
      affected hosts, and justified candidate paths. Prefix evidence IDs with repo-.
      Request:
      ${scope_request.result.content}
      Host evidence:
      ${investigate_host.result.content}

      Final handoff: return a self-contained JSON object matching the contract below.
      Include all observations, exact values, source references, uncertainty, and
      justification needed downstream in this final answer; later steps do not receive
      your tool transcript. Use null/empty arrays for unknowns without inventing facts.
      Response contract (also enforced as the response schema):
      {"type":"object","additionalProperties":false,"properties":{"summary":{"type":"string"},"evidence":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string"},"tool":{"type":"string"},"source":{"type":"string"},"observation":{"type":"string"}},"required":["id","tool","source","observation"]}},"unanswered_questions":{"type":"array","items":{"type":"string"}}},"required":["summary","evidence","unanswered_questions"]}
  settings:
    timeout: 1200
    continue_on_failure: false
- id: analyze_case
  type: agentic
  name: Analyze cause, alternatives, and remediation scope
  parameters:
