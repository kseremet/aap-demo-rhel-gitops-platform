      Resolve only this reviewer-requested check, using GitHub/Linux MCP as appropriate.
      Return exact source-attributed results, including failed checks and contradictions.
      Prefix evidence IDs with followup-<check index>- so parallel observations never collide.
      A missing tool or permission is an unanswered question, not proof of a hypothesis.
      Check index:
      ${loop.index}
      Requested check:
      ${loop.item}
      Initial analysis:
      ${analyze_case.result.content}
      Request:
      ${scope_request.result.content}

      Final handoff: return a self-contained JSON object matching the contract below.
      Include all observations, exact values, source references, uncertainty, and
      justification needed downstream in this final answer; later steps do not receive
