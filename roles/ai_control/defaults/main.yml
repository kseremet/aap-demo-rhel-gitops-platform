---
# AI control-system defaults. CrewAI can use the containerized HTTP MCP service
# or the local stdio server; both connect to the fleet through SSH aliases.
ai_control_user: cloud-user
ai_control_venv_path: "/home/{{ ai_control_user }}/.venv"
ai_control_app_path: "/home/{{ ai_control_user }}/agentic-aiops"
ai_control_ssh_dir: "/home/{{ ai_control_user }}/.ssh"
ai_control_private_key_path: "{{ ai_control_ssh_dir }}/id_ed25519"
ai_control_known_hosts_path: "{{ ai_control_ssh_dir }}/known_hosts"
# CrewAI backend selected in demo variables (`container` or `local`).
ai_control_mcp_mode: "{{ demo_ai_mcp_mode | default('container') }}"
# In-namespace HTTP URL used when the container backend is selected.
ai_control_mcp_url: "{{ demo_ai_mcp_url | default('http://linux-mcp-server:8000/mcp') }}"
# Container image used by the always-deployed OpenShift MCP service.
ai_control_mcp_container_image: "{{ demo_ai_mcp_container_image | default('quay.io/redhat-services-prod/rhel-lightspeed-tenant/linux-mcp-server:latest') }}"
# Names for the OpenShift workload, client Service, config, and SSH Secret.
ai_control_mcp_deployment_name: linux-mcp-server
ai_control_mcp_service_name: linux-mcp-server
ai_control_mcp_configmap_name: linux-mcp-server-config
ai_control_mcp_secret_name: linux-mcp-server-ssh
# SSH identity and filesystem paths inside the MCP container.
ai_control_mcp_container_user: cloud-user
ai_control_mcp_log_dir: /var/lib/mcp/.local/share/linux-mcp-server/logs
ai_control_mcp_config_dir: /var/lib/mcp/.ssh
ai_control_mcp_policy_path: /var/lib/mcp/.ssh/policy.yaml
ai_control_mcp_key_path: /var/lib/mcp/.ssh/id_ed25519
# Initial modest resource budget for the single-replica demo service.
ai_control_mcp_resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Keep these versions aligned with the validated RHEL MCP reference setup.
ai_control_pip_packages:
  - "fastmcp==2.14.5"
  - "linux-mcp-server==1.4.1"
  - mcp
  - "crewai[openai]"
  - fastapi
  - uvicorn
  - httpx
  - openai
  - requests
  - python-dotenv
  - pysqlite3-binary

ai_control_target_hosts: []
ai_control_llm_provider: "{{ demo_ai_llm_provider | default('openai') }}"
ai_control_llm_model: "{{ demo_ai_llm_model | default('gpt-5.6-luna') }}"
ai_control_llm_base_url: "{{ demo_ai_llm_base_url | default('https://api.openai.com/v1') }}"
ai_control_llm_api_key: "{{ vault_ai_llm_api_key | default('') }}"
ai_control_github_token: "{{ vault_github_token | default('') }}"
ai_control_state_repo_url: "{{ demo_state_scm_url }}"
ai_control_state_repo_branch: "{{ demo_state_scm_branch | default('main') }}"
ai_control_github_api_url: "{{ demo_ai_github_api_url | default('https://api.github.com') }}"
ai_control_repo_path: "{{ demo_ai_repo_path | default('/home/' ~ ai_control_user ~ '/agentic-aiops/state-repo') }}"
ai_control_pr_branch_prefix: "{{ demo_ai_pr_branch_prefix | default('aiops/') }}"
ai_control_agent_path: "{{ ai_control_app_path }}/incident_agent.py"
ai_control_review_agent_path: "{{ ai_control_app_path }}/pr_review_agent.py"
ai_control_mcp_user: "cloud-user"
