---
- name: Validate the selected CrewAI MCP backend
  ansible.builtin.assert:
    that:
      - ai_control_mcp_mode in ['container', 'local']
    fail_msg: >-
      Set demo_ai_mcp_mode to either `container` or `local` in
      group_vars/all/demo_variables.yml.
  tags:
    - ai_control
    - mcp

- name: Register the AI control VM with Red Hat
  ansible.builtin.include_role:
    name: redhat.rhel_system_roles.rhc
  vars:
    rhc_repositories: "{{ rhc_repos_baseline | default([]) }}"
  tags:
    - ai_control
    - rhc
    - subscription

- name: Install AI control-system operating-system packages
  ansible.builtin.include_tasks: packages.yml
  tags:
    - ai_control
    - packages

- name: Configure SSH from the AI control VM to the RHEL fleet
  ansible.builtin.include_tasks: ssh.yml
  tags:
    - ai_control
    - ssh

- name: Deploy the containerized Linux MCP service in OpenShift
  ansible.builtin.include_tasks: container_mcp.yml
  tags:
    - ai_control
    - mcp
    - openshift

- name: Install the CrewAI and Linux MCP Python environment
  ansible.builtin.include_tasks: python.yml
  tags:
    - ai_control
    - python
    - mcp

- name: Write AI runtime configuration for the next demo phase
  ansible.builtin.include_tasks: config.yml
  tags:
    - ai_control
    - config

- name: Deploy and verify the CrewAI runtime scripts
  ansible.builtin.import_tasks: runtime.yml
  tags:
    - ai_control
    - crewai
